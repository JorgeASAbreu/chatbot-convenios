[project]
name = "chatbot-convenios-pmmg"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["streamlit>=1.40", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.14", "pydantic>=2.10", "pydantic-settings>=2.6", "httpx>=0.28", "bcrypt>=4.2", "openai>=1.58", "google-genai>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
